<title>TeaCo 经营驾驶舱</title>
<!-- UI REFERENCE — TeaCo 经营驾驶舱 (docs/ontology-plus-teaco-spec-v0.3.md §11.1).
     The management console Ontology Plus shows for one connected Runnable System (here the TeaCo
     order system) once it is built, deployed and verified. Chosen on 2026-11-25 from four variants
     (decision inbox, lifecycle stages and conversation-first were the others; they stay on branch
     proto/teaco-ops-state). This page fixes layout, information hierarchy, wording and the behaviour of
     decisions, approvals, the AI 助手 panel and requirement versions; it is not production code.
     Business actions run in memory and reset on reload. Supplier knowledge is example data; the AI
     check-up shows "not yet run" on purpose.
     Data: derived from Business Bench tasks/build/order-management seed 0 (erphq/business-bench @ b6e3b15,
     MIT licence), normalised at build time to 142 customers, 60 teas, 110 orders.
     Appearance reads only Workbench Theme contract tokens (ADR 0015) from the generated stylesheet.
     Open by double-click, or with `pnpm dev:web` at
     http://127.0.0.1:5173/docs/ui-reference/teaco-operations-console.html (loads fonts and the 暖纸 texture). -->

@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/fonts/inter-latin-opsz-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url("/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url("/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 600; font-display: swap; src: url("/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400 500; font-display: swap; src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }

/* Type and shell sizes mirror src/web/tokens.css; everything that paints reads a theme token. */
:root {
  --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px; --text-xl: 20px; --text-2xl: 24px;
  --radius-pill: 999px; --topbar-h: 56px;
  color-scheme: light dark; accent-color: var(--primary);
  scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent;
}
[data-theme="light"] { color-scheme: light; }
[data-theme="dark"] { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; background-color: var(--background); background-image: var(--backdrop-image); background-size: var(--backdrop-size, auto);
  color: var(--foreground); font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button, input, select { margin: 0; font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.ico { flex-shrink: 0; vertical-align: middle; }
.muted { color: var(--muted-foreground); }
.faint { color: var(--faint-foreground); }
.ok { color: var(--success); } .warn { color: var(--warning); } .bad { color: var(--destructive); } .pri { color: var(--primary); }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; grid-auto-rows: max-content; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.grow { flex: 1; min-width: 0; }

/* ─── Buttons, segmented controls, fields (beautifui) ─── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--foreground); font-family: var(--font-sans); font-size: 12.5px; font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; user-select: none; transition: background-color 150ms, border-color 150ms, color 150ms, box-shadow 150ms; }
.btn:enabled:hover { background: var(--muted); border-color: var(--border-strong); }
.btn:enabled:active { transform: translateY(0.5px); }
.btn:focus-visible { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 11.5px; gap: 4px; }
.btn.md { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.accent { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn.accent:enabled:hover { background: var(--primary); border-color: var(--primary); filter: brightness(0.93); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--foreground-soft); }
.btn.ghost:enabled:hover { background: var(--accent); color: var(--foreground); }
.btn.quiet { background: var(--muted); border-color: transparent; color: var(--foreground-soft); }
.btn.quiet:enabled:hover { background: var(--accent-strong); color: var(--foreground); }
.btn.link { height: auto; padding: 0; border: 0; background: transparent; color: var(--primary); }
.btn.link:enabled:hover { background: transparent; text-decoration: underline; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--muted); }
.seg .btn { height: 24px; padding: 0 8px; font-size: var(--text-xs); background: transparent; border-color: transparent; color: var(--foreground-soft); }
.seg .btn:enabled:hover { background: var(--accent); color: var(--foreground); }
.seg .btn[aria-pressed="true"] { background: var(--card); border-color: var(--border); color: var(--foreground); box-shadow: var(--shadow-xs); }
.field { height: 28px; padding: 0 8px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--card); color: var(--foreground); font-size: 12.5px; }
.field:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus-ring); }
input.field[type="number"] { width: 80px; font-family: var(--font-mono); }

/* ─── Pills, chips ─── */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground); }
.pill.accent { background: var(--primary-soft); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 28%, transparent); }
.pill.done { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 28%, transparent); }
.pill.progress { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 28%, transparent); }
.pill.error { background: var(--destructive-soft); color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 28%, transparent); }
.pill.new { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); flex-shrink: 0; }
.dot.warn { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--card); font-size: 12.5px; color: var(--foreground-soft); cursor: pointer; }
.chip:hover { border-color: var(--border-strong); background: var(--muted); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }

/* ─── Cards ─── */
.card { background: var(--card); color: var(--card-foreground); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; min-width: 0; font-size: var(--text-sm); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.card-title { display: flex; align-items: center; gap: 8px; font-size: var(--text-base); font-weight: 600; color: var(--foreground); }
.card-sub { margin-top: 2px; font-size: 12.5px; color: var(--faint-foreground); }
.card-pad { padding: 14px 16px; display: grid; gap: 10px; }
.card-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 40%, transparent); }
.count { border-radius: var(--radius-pill); background: var(--muted); padding: 1px 8px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; color: var(--faint-foreground); }
.note { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.6; }
.callout { font-size: 12.5px; line-height: 1.6; padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--muted) 45%, transparent); color: var(--foreground-soft); }
.callout.warn { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 28%, transparent); color: var(--foreground); }
.headline { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; line-height: 1.35; color: var(--foreground); text-wrap: balance; }
.headline em { font-style: normal; color: var(--primary); }
.eyebrow { font-size: var(--text-xs); font-weight: 600; color: var(--muted-foreground); }
.section-title { display: flex; align-items: center; gap: 8px; font-size: var(--text-base); font-weight: 600; color: var(--foreground); }

/* ─── Product top bar (shared header) ─── */
.topbar { position: sticky; top: 0; z-index: 20; min-height: var(--topbar-h); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 20px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: saturate(1.2) blur(6px); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-md); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.brand-name { font-family: var(--font-title); font-size: var(--text-base); font-weight: 600; }
.brand-sub { font-size: var(--text-xs); color: var(--faint-foreground); }
.who { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--foreground-soft); }
.avatar { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--muted); color: var(--foreground-soft); font-size: 11.5px; font-weight: 600; box-shadow: var(--shadow-hairline); }

/* ─── KPI tiles ─── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: var(--text-xs); color: var(--muted-foreground); }
.kpi .v { font-family: var(--font-title); font-size: var(--text-xl); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--foreground); }
.kpi .h { font-size: 11.5px; color: var(--faint-foreground); }
.kpi.compact { box-shadow: none; background: transparent; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); border-radius: 0; }

/* ─── Status flow ─── */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow-step { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card); font-size: 12.5px; color: var(--foreground-soft); cursor: pointer; }
.flow-step strong { font-family: var(--font-mono); font-weight: 500; color: var(--foreground); }
.flow-step[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.flow-step.is-new { border-style: dashed; border-color: var(--primary); }
span.flow-step { cursor: default; }
.flow-arrow { color: var(--faint-foreground); }

/* ─── Tables ─── */
.table-region { width: 100%; overflow-x: auto; }
.table-region > table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table-region thead tr { background: color-mix(in srgb, var(--muted) 50%, transparent); border-bottom: 1px solid var(--border); }
.table-region th { padding: 9px 12px; font-size: 11.5px; font-weight: 600; color: var(--faint-foreground); text-align: left; white-space: nowrap; }
.table-region td { padding: 9px 12px; vertical-align: middle; border-top: 1px solid var(--border); }
.table-region tbody tr:first-child td { border-top: 0; }
.table-region tbody tr.clickable { cursor: pointer; }
.table-region tbody tr.clickable:hover { background: var(--accent); }
.table-region tbody tr.is-active { background: var(--primary-soft); }
.table-region .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell-sub { margin-top: 2px; font-size: var(--text-xs); color: var(--muted-foreground); }

/* ─── Decision card (ApprovalCard) ─── */
.dc { background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; font-size: var(--text-sm); }
.dc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.dc.k-data .dc-head, .dc.k-system .dc-head { background: color-mix(in srgb, var(--warning-soft) 60%, transparent); }
.dc.k-change .dc-head, .dc.k-knowledge .dc-head { background: color-mix(in srgb, var(--muted) 60%, transparent); }
.dc-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 600; color: var(--primary); }
.dc.k-data .dc-kicker, .dc.k-system .dc-kicker { color: var(--warning); }
.dc.k-change .dc-kicker, .dc.k-knowledge .dc-kicker { color: var(--foreground-soft); }
.dc-body { padding: 12px 14px; display: grid; gap: 8px; }
.dc-title { font-size: var(--text-base); font-weight: 600; line-height: 1.4; color: var(--foreground); }
.dc-what { font-size: 12.5px; line-height: 1.6; color: var(--foreground-soft); }
.dc-effects { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.dc-effects li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--background) 55%, transparent); border: 1px solid var(--border-subtle); font-size: 12.5px; }
.dc-effects .ico { margin-top: 3px; color: var(--primary); }
details.more > summary { cursor: pointer; font-size: var(--text-xs); font-weight: 500; color: var(--muted-foreground); padding: 2px 0; }
details.more ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: var(--text-xs); color: var(--foreground-soft); line-height: 1.55; }
.dc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 40%, transparent); }
.dc-foot .hint { margin-right: auto; font-size: var(--text-xs); color: var(--faint-foreground); }
.dc.compact .dc-body { padding: 10px 12px; gap: 4px; }
.dc.compact .dc-title { font-size: var(--text-sm); }

/* ─── Activity, lists ─── */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.feed li { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 0; font-size: 12.5px; color: var(--foreground-soft); }
.feed .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint-foreground); padding-top: 1px; }
.feed .ico { margin-top: 3px; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.checklist li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
.checklist li:first-child { border-top: 0; }
.checklist .ico { margin-top: 2px; }
.checklist .t1 { font-size: var(--text-sm); font-weight: 500; color: var(--foreground); }
.checklist .t2 { font-size: var(--text-xs); color: var(--muted-foreground); line-height: 1.55; margin-top: 2px; }
.bar { height: 6px; border-radius: var(--radius-pill); background: var(--muted); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--primary); }
.bar.low > span { background: var(--warning); }
.bar.zero > span { background: var(--destructive); }

/* ─── Chart ─── */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--border-subtle); stroke-width: 1; }
.chart .axis { fill: var(--faint-foreground); font-size: 11px; font-family: var(--font-sans); }
.chart .val { fill: var(--foreground-soft); font-size: 11px; font-family: var(--font-mono); }
.chart .s-r { fill: var(--primary); }
.chart .s-w { fill: var(--model-m6); }
.legend { display: flex; gap: 14px; font-size: var(--text-xs); color: var(--muted-foreground); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: var(--radius-xs); margin-right: 4px; vertical-align: -1px; }
.legend .s-r { background: var(--primary); } .legend .s-w { background: var(--model-m6); }

/* ─── Console layout: module nav, page, AI 助手 panel ─── */
.va { display: grid; grid-template-columns: minmax(0, 1fr); }
.va-nav { background: var(--canvas); border-bottom: 1px solid var(--border); padding: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--foreground-soft); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; }
.nav-item:hover { background: var(--accent); color: var(--foreground); }
.nav-item[aria-current="page"] { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-btn); }
.nav-item:disabled { cursor: not-allowed; opacity: 0.55; }
.nav-item .n-badge { margin-left: auto; }
.nav-item .lock { margin-left: auto; font-size: 11px; color: var(--faint-foreground); }
.va-main { padding: 20px; min-width: 0; }
.va-side { background: var(--canvas); border-top: 1px solid var(--border); padding: 14px; }
@media (min-width: 1280px) {
  .va { grid-template-columns: 216px minmax(0, 1fr) 360px; height: calc(100vh - var(--topbar-h)); }
  .va-nav { flex-direction: column; flex-wrap: nowrap; border-bottom: 0; border-right: 1px solid var(--border); overflow: auto; }
  .va-main { overflow: auto; padding: 24px 28px 96px; }
  .va-side { border-top: 0; border-left: 1px solid var(--border); overflow: auto; padding-bottom: 96px; }
}
.two { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }

/* ─── Reference controls (not part of the design) ─── */
.msg-ai { display: grid; gap: 8px; }
.msg-ai .who-ai { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 600; color: var(--primary); }
.msg-ai .say { font-size: var(--text-sm); line-height: 1.65; color: var(--foreground); }
.basis { font-size: 11.5px; color: var(--faint-foreground); line-height: 1.5; }
.protobar { position: fixed; left: 0; right: 0; bottom: 12px; margin: 0 auto; width: max-content; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; max-width: calc(100vw - 24px); padding: 6px 10px; border-radius: var(--radius-window); background: var(--foreground); color: var(--background); box-shadow: var(--shadow-lg); font-size: var(--text-xs); }
.protobar .pb-btn { display: grid; place-items: center; height: 26px; min-width: 26px; padding: 0 6px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--background); cursor: pointer; font-size: 12px; }
.protobar .pb-btn:hover { background: color-mix(in srgb, var(--background) 16%, transparent); }
.protobar .pb-btn[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.protobar .pb-label { min-width: 150px; text-align: center; font-weight: 600; }
.protobar .pb-sep { width: 1px; height: 18px; background: color-mix(in srgb, var(--background) 30%, transparent); }
.protobar select { height: 26px; border-radius: var(--radius-sm); border: 0; background: color-mix(in srgb, var(--background) 14%, transparent); color: var(--background); padding: 0 6px; font-size: 12px; }
.protobar select option { color: var(--foreground); background: var(--card); }
.protobar .pb-group { display: inline-flex; align-items: center; gap: 2px; }

  function revTimeline() {
    const cur = revIndex(S.revision);
    return `<ul class="checklist">${REVS.map((r, i) => `<li>${i <= cur ? icon('circleCheck', 14, 'ok') : i === cur + 1 ? icon('git', 14, 'pri') : icon('git', 14, 'faint')}<div><div class="t1">${r.id} · ${esc(r.name)}</div><div class="t2">${i === 0 ? '客户最初的需求：订单、客户、商品和概览' : esc(r.adds[0])}</div></div>${i <= cur ? pill('done', i === cur ? '当前版本' : '已上线') : i === cur + 1 ? pill('progress', '等你确认') : pill('', '还没开始')}</li>`).join('')}</ul>`;
  }
  const knowledgeList = () => `<ul class="checklist">${knowledge().map((k) => `<li>${icon('book', 14, 'faint')}<div><div class="t1">${esc(k.t)}：${esc(k.v)}</div><div class="t2">${esc(k.d)}</div></div>${pill(k.st, k.label)}</li>`).join('')}</ul>`;
  function benchCard() {
    const tracks = [['从表格里理出业务', 10], ['搭出应用', 10], ['接入数据', 15], ['回答经营问题', 20], ['发现和修数据问题', 10], ['安全地办事', 15], ['记住和更新知识', 10], ['长期经营', 10]];
    return `<div class="card"><div class="card-head"><div><div class="card-title">AI 能力体检</div><div class="card-sub">每次需求变化后自动跑一遍；只展示真实跑出来的结果</div></div>${pill('', '尚未运行')}</div>
      <div class="card-pad"><div class="eyebrow">原始验收清单</div><div class="row">${REVS.map((r) => `<span class="chip" style="cursor:default">${r.id}：${r.checks} 项 · 未运行</span>`).join('')}</div>
      <div class="eyebrow">扩展体检 100 项</div><ul class="checklist">${tracks.map(([t, n]) => `<li>${icon('gauge', 14, 'faint')}<div><div class="t1">${t}</div></div><span class="muted">${n} 项 · 计划中</span></li>`).join('')}</ul>
      <p class="note">没跑过的显示「尚未运行」，不会显示估算分数。</p></div></div>`;
  }
  function answerBlock(a, q) {
    const tone = a.tone === 'warn' ? 'callout warn' : '';
    let extra = '';
    if (a.table) extra += a.table;
    if (a.chart) extra += monthlyChart();
    if (a.list) extra += `<ul class="checklist">${a.list.map((x) => `<li>${icon('alert', 14, 'warn')}<div class="t1">${esc(x)}</div><span></span></li>`).join('')}</ul>`;
    if (a.decisions) extra += a.decisions.map((id) => { const d = decisions().find((x) => x.id === id); return d ? decisionCard(d, true) : decidedLine(id); }).join('');
    return `<div class="msg-ai">${q ? '' : ''}<span class="who-ai">${icon('sparkles', 13)}AI 助手</span><p class="say ${tone}">${esc(a.say)}</p>${extra}${a.basis ? `<p class="basis">${esc(a.basis)}</p>` : ''}</div>`;
  }
  const askChips = (target) => `<div class="row">${QUESTIONS.map((x) => `<button type="button" class="chip" data-act="ask" data-target="${target}" data-v="${x.id}">${esc(x.q)}</button>`).join('')}</div>`;

  /* ---------- Variant A: module workbench ---------- */
  function variantA() {
    const st = S.a, ds = decisions();
    const nav = [
      ['home', '今日概览', 'home', ds.length ? pill('accent', ds.length) : ''],
      ['orders', '订单与发货', 'truck', ''],
      ['stock', '库存', 'box', S.products['HRB-PEPMNT-2OZ'].locked ? pill('progress', 1) : ''],
      ['report', '月度报表', 'chart', has('monthly') ? fresh('monthly') : '<span class="lock">v2 上线后</span>', !has('monthly')],
      ['data', '数据体检', 'shield', ''],
      ['rules', '规则与知识', 'book', S.kb === 'open' && S.actor === 'owner' ? pill('progress', 1) : ''],
      ['apps', '应用与连接', 'plug', S.connection === 'drifted' ? pill('progress', '待核对') : ''],
      ['changes', '需求变化', 'git', ''],
      ['bench', 'AI 能力体检', 'gauge', ''],
    ];
    const navHtml = nav.map(([id, label, ic, badge, off]) => `<button type="button" class="nav-item" data-act="nav" data-v="${id}" ${st.page === id ? 'aria-current="page"' : ''}${off ? ' disabled' : ''}>${icon(ic, 15)}<span>${label}</span><span class="n-badge">${badge}</span></button>`).join('');
    const pages = {
      home: () => `<div class="stack" style="gap:20px"><div class="stack" style="gap:6px"><span class="eyebrow">今日概览 · 9 月 10 日</span><h1 class="headline">${headline()}</h1></div>${kpiTiles()}
        <div class="two"><div class="stack"><div class="section-title">等你决定 <span class="count">${ds.length}</span></div>${ds.length ? ds.map((d) => decisionCard(d, true)).join('') : '<div class="callout">都处理完了。有新的事会出现在这里。</div>'}</div>
        <div class="stack">${has('monthly') ? `<div class="card"><div class="card-head"><div class="card-title">每月已发货销售额${fresh('monthly')}</div></div><div class="card-pad">${monthlyChart()}</div></div>` : `<div class="card"><div class="card-pad"><div class="eyebrow">${icon('lock', 13)} 按月走势</div><p class="note">需求 v2「按月销售报表」上线后，这里显示每月销售走势。现在只有总数：已发货销售额 ${money(kpis().sales)}。</p></div></div>`}
        <div class="card"><div class="card-head"><div class="card-title">最近发生的事</div></div><div class="card-pad">${feed(5)}</div></div></div></div></div>`,
      orders: () => { const o = S.orders.find((x) => x.no === st.order && canSee(x)); return `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">订单与发货</span><h1 class="headline">${me().scope}共 ${kpis().total} 张订单，<em>${kpis().open} 张</em>还没发货</h1></div>
        <div class="row"><span class="seg"><button type="button" class="btn" data-act="filter" data-v="OPEN" aria-pressed="${st.filter === 'OPEN'}">没发货</button><button type="button" class="btn" data-act="filter" data-v="ALL" aria-pressed="${st.filter === 'ALL'}">全部</button></span><span class="note">或按状态看：</span></div>${flowChips(st.filter, 'filter')}
        <div class="two"><div class="card">${ordersTable(st.filter === 'ALL' ? null : st.filter, st.order)}</div><div class="stack">${orderDetail(o)}${S.actor !== 'jonah' ? quoteCard() : ''}</div></div></div>`; },
      stock: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">库存</span><h1 class="headline">60 款茶里，<em>${Object.values(S.products).filter((p) => p.locked || p.stock <= 5).length} 款</em>库存很少或被锁住</h1></div>
        <div class="two"><div class="card"><div class="card-pad">${stockList(20)}</div></div><div class="stack">${ds.filter((d) => d.id === 'repair').map((d) => decisionCard(d)).join('') || '<div class="callout">没有等你确认的库存问题。</div>'}<p class="note">库存只在发货时扣减。导入的历史订单不再扣库存。</p></div></div></div>`,
      report: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">月度报表${fresh('monthly')}</span><h1 class="headline">1–8 月已发货销售额 <em>${money(kpis().sales)}</em></h1><p class="note">按下单日期算月份，只算已发货和已送达的订单；取消的不算。${S.actor === 'jonah' ? '你只看得到自己客户的批发订单。' : ''}</p></div>
        <div class="card"><div class="card-pad">${monthlyChart()}</div></div><div class="card">${monthTable()}</div></div>`,
      data: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">数据体检</span><h1 class="headline">导入的 3 份表格里发现 9 类问题，<em>${health().filter((h) => !h.ok).length ? '还有 1 类等你确认' : '都已处理'}</em></h1></div>
        <div class="two"><div class="card"><div class="card-pad">${healthList()}</div></div><div class="stack">${ds.filter((d) => d.id === 'repair').map((d) => decisionCard(d)).join('')}<p class="note">原始表格一个字都没改。每一处修正都记了来源和原因，随时能查。</p></div></div></div>`,
      rules: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">规则与知识</span><h1 class="headline">订单系统按这 <em>${rules().length} 条规则</em>运行</h1><p class="note">规则来自客户需求原文和之后确认的需求变化。AI 记下的资料（下方）不会自己改规则。</p></div>
        <div class="two"><div class="card"><div class="card-pad">${rulesList()}</div></div><div class="stack">${quoteCard()}<div class="card"><div class="card-head"><div><div class="card-title">AI 记下的资料</div><div class="card-sub">示例：扩展场景，不在原始的 3 份表格里</div></div></div><div class="card-pad">${knowledgeList()}</div></div>${ds.filter((d) => d.id === 'kb').map((d) => decisionCard(d)).join('')}</div></div></div>`,
      apps: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">应用与连接</span><h1 class="headline">${S.connection === 'drifted' ? '订单系统刚更新，<em>等 AI 重新核对</em>' : '订单系统在运行，<em>AI 已连接并核对</em>'}</h1></div>
        <div class="two">${connectionCard()}<div class="stack">${ds.filter((d) => d.id === 'reverify').map((d) => decisionCard(d)).join('')}<div class="card"><div class="card-head"><div class="card-title">谁能做什么</div></div><div class="card-pad"><ul class="checklist"><li>${icon('users', 14, 'faint')}<div><div class="t1">店主</div><div class="t2">看全部；管理用户、库存和规则；批准重要操作</div></div><span></span></li><li>${icon('users', 14, 'faint')}<div><div class="t1">客户经理（Jonah、Priya、Carlos）</div><div class="t2">只看自己负责的批发客户和订单${has('hold') ? '；可以挂起，不能解除' : ''}</div></div><span></span></li><li>${icon('users', 14, 'faint')}<div><div class="t1">财务</div><div class="t2">看全部，不能改</div></div><span></span></li><li>${icon('sparkles', 14, 'pri')}<div><div class="t1">AI 助手</div><div class="t2">权限永远不超过正在用它的人；每次改数据都要人批准</div></div><span></span></li></ul></div></div></div></div></div>`,
      changes: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">需求变化</span><h1 class="headline">现在是需求 <em>${S.revision}</em>：${esc(REVS[revIndex(S.revision)].name)}</h1><p class="note">每次需求变化都先改规则，再改系统、跑验收，确认后才上线；可以回退。</p></div>
        <div class="two"><div class="card"><div class="card-pad">${revTimeline()}</div></div><div class="stack">${ds.filter((d) => d.id.startsWith('rev-')).map((d) => decisionCard(d)).join('') || '<div class="callout">没有等你确认的需求变化。</div>'}</div></div></div>`,
      bench: () => `<div class="stack" style="gap:16px"><div class="stack" style="gap:6px"><span class="eyebrow">AI 能力体检</span><h1 class="headline">AI 能不能放心用？<em>用固定的考题来量</em></h1><p class="note">这和经营数字分开看：这里量的是 AI，不是生意。</p></div>${benchCard()}</div>`,
    };
    const ans = st.answer ? answerBlock(answer(st.answer)) : '<p class="note">问一句，AI 去订单系统里查，并告诉你数字是怎么算出来的。</p>';
    return `<div class="va"><nav class="va-nav" aria-label="模块" data-scroll="a-nav">${navHtml}</nav><main class="va-main" data-scroll="a-main">${pages[st.page]()}</main>
      <aside class="va-side stack" data-scroll="a-side"><div class="spread"><span class="section-title">${icon('sparkles', 15, 'pri')} AI 助手</span><span class="muted" style="font-size:12px">以 ${esc(me().name)} 的身份</span></div>${ans}<div class="eyebrow">可以这样问</div>${askChips('a')}</aside></div>`;
  }

  /* ---------- prototype bar, toast, render ---------- */
  function protobar() {
    const seg = (act, opts, cur) => `<span class="pb-group">${opts.map(([v, l]) => `<button type="button" class="pb-btn" data-act="${act}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</span>`;
    document.getElementById('protobar').innerHTML =
      `<span class="pb-label">参考控制（不属于界面）</span>
      <span class="pb-sep"></span><span class="pb-cap">身份</span><select data-change="actor" aria-label="身份">${Object.entries(ACTORS).map(([id, a]) => `<option value="${id}"${id === S.actor ? ' selected' : ''}>${esc(a.name)}（${esc(a.role)}）</option>`).join('')}</select>
      <span class="pb-sep"></span><span class="pb-cap">需求</span>${seg('rev', REVS.map((r) => [r.id, r.id]), S.revision)}
      <span class="pb-sep"></span>${seg('theme', [['default', '默认'], ['warm-paper', '暖纸']], UI.theme)}${seg('mode', [['light', '浅'], ['dark', '深']], UI.mode)}
      <span class="pb-sep"></span><button type="button" class="pb-btn" data-act="reset">重置</button>`;
  }
  function toast(title, lines, tone) {
    const el = document.getElementById('toast');
    el.innerHTML = `<div class="spread"><span class="tt">${tone === 'warn' ? icon('alert', 15, 'warn') : icon('circleCheck', 15, 'ok')}${esc(title)}</span><button type="button" class="btn ghost xs" data-act="toast-close" aria-label="关闭">${icon('x', 12)}</button></div>${lines && lines.length ? `<ul>${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}`;
    el.hidden = false;
    clearTimeout(UI.toastTimer); UI.toastTimer = setTimeout(() => { el.hidden = true; }, 8000);
  }
  function render() {
    const r = document.documentElement;
    if (UI.theme === 'warm-paper') r.setAttribute('data-workbench-theme', 'warm-paper'); else r.removeAttribute('data-workbench-theme');
    r.setAttribute('data-theme', UI.mode);
    const scroll = {}; document.querySelectorAll('[data-scroll]').forEach((el) => { scroll[el.getAttribute('data-scroll')] = el.scrollTop; });
    document.getElementById('app').innerHTML = header() + variantA();
    document.querySelectorAll('[data-scroll]').forEach((el) => { const v = scroll[el.getAttribute('data-scroll')]; if (v) el.scrollTop = v; });
    protobar();
  }
  function ask(target, id) {
    if (target === 'a') S.a.answer = id;
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'toast-close') { document.getElementById('toast').hidden = true; return; }
    if (act === 'theme') UI.theme = v;
    else if (act === 'mode') UI.mode = v;
    else if (act === 'rev') setRevision(v, false);
    else if (act === 'reset') { S = initial(S); document.getElementById('toast').hidden = true; }
    else if (act === 'nav') S.a.page = v;
    else if (act === 'filter') S.a.filter = v === 'ALL' || v === 'OPEN' ? v : S.a.filter === v ? 'ALL' : v;
    else if (act === 'order') { S.a.order = v; }
    else if (act === 'approve') approve(v);
    else if (act === 'decline') decline(v);
    else if (act === 'ask') ask(b.getAttribute('data-target'), v);
    render();
  });
  document.addEventListener('change', (e) => {
    const k = e.target.getAttribute('data-change'); if (!k) return;
    if (k === 'actor') { S.actor = e.target.value; S.a.order = null; render(); }
  });
  document.addEventListener('input', (e) => { if (e.target.getAttribute('data-input') === 'repairQty') S.repairQty = e.target.value; });
  render();
})();
</script>
</body>
</html>
